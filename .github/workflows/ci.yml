name: Lua Static Analyzer CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-analyze:
    name: Run Tests & Devirtualization Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -e .

      - name: Run Test Suite (100 Regression & Security Tests)
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run Deep Devirtualization Pipeline on Samples
        run: |
          mkdir -p output/
          for sample in samples/*.lua; do
            echo "Processing sample: $sample"
            python cli.py "$sample" -o output/ --deep --vm-analysis
          done

      - name: Verify Output Files Exist
        run: |
          set -e
          echo "Verifying generated files..."
          for base in sample_loader sample_hex_escaped sample_table_mapped sample_control_flow target_hune; do
            test -f "output/${base}_cleaned.lua"
            test -f "output/${base}_analysis_report.md"
            test -f "output/${base}_ir.txt"
            test -f "output/${base}_cfg.json"
            test -f "output/${base}_prototypes.json"
            test -f "output/${base}_constants.json"
            test -f "output/${base}_opcodes.json"
            test -f "output/${base}_symbolic.json"
          done
          echo "All expected artifact files successfully verified!"
          ls -la output/

      - name: Validate Output JSON Schemas
        run: |
          python -c "
          import json, glob
          for jf in glob.glob('output/*.json'):
              with open(jf) as f:
                  data = json.load(f)
              assert isinstance(data, (dict, list)), f'Invalid JSON format in {jf}'
          print('All JSON artifacts validated successfully!')
          "

      - name: Publish Summary to Job Summary
        run: |
          echo "## 🛡️ Lua Static Analyzer & Devirtualization Results" >> $GITHUB_STEP_SUMMARY
          echo "✅ Đã hoàn thành 100/100 tests và chạy phân tích thành công trên tệp mục tiêu target_hune.lua." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Báo cáo phân tích target_hune.lua:" >> $GITHUB_STEP_SUMMARY
          cat output/target_hune_analysis_report.md >> $GITHUB_STEP_SUMMARY

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: analysis-output-artifacts
          path: output/
          retention-days: 7
